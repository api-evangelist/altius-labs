aid: altius-labs
name: Altius Labs
description: >-
  Altius Labs builds customized, high-performance blockchain infrastructure for
  high-frequency onchain markets and trading applications. Founded by former
  Hudson River Trading engineers, Altius offers a VM-agnostic modular execution
  stack that decouples execution from consensus and storage to deliver parallel
  transaction processing, targeting 10,000+ TPS and sub-millisecond latency
  while remaining EVM-compatible through a hybrid architecture (Altius L1 for
  settlement plus a high-performance execution coprocessor). Applications
  retain gas fees, sequencing revenue, and governance rather than ceding them
  to a base layer. The stack integrates with existing L1, L2, and app chains and
  supports multiple virtual machines (EVM, MoveVM, CosmWasm, SolanaVM). Altius
  Labs is backed by Founders Fund, Pantera Capital, Archetype, and others, and
  positions itself as institutional-grade dedicated chain infrastructure
  deployable in weeks rather than years.
